[Whisper]
; 模型大小：tiny / base / small / medium / large-v3
; 模型越大准确率越高，但速度越慢、占用显存越多
; 已预下载small模型，推荐小白直接使用
model_size = small

; 转写语言：zh=中文, en=英文, ja=日文, auto=自动检测
language = zh

; 输出字幕格式：srt / vtt / txt
; 默认同时生成srt字幕和txt文稿
output_format = srt,txt

; 运行设备：cpu / cuda（有N卡显卡填cuda，没有就填cpu）
device = cpu

[Path]
; ffmpeg相对路径，请勿修改
ffmpeg_path = ./bin/ffmpeg.exe
ffprobe_path = ./bin/ffprobe.exe

; 模型缓存目录，请勿修改
cache_dir = ./cache
